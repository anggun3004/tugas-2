<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Document</title>
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css">
</head>
<body>
  <!--Progres Dasar-->
  <div class="progress">
  <div class="progress-bar" role="progressbar" style="width: 40%" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100"></div>
</div>

  <!--Progress dengan Persentase-->
  <div class="progress">
  <div class="progress-bar" role="progressbar" style="width: 60%" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100">60%</div>
</div>

  <!--Warna Progres (Contextual Backgrounds)-->
  <div class="progress mb-2">
  <div class="progress-bar bg-success" role="progressbar" style="width: 80%" aria-valuenow="80" aria-valuemin="0" aria-valuemax="100">80%</div>
</div>

<div class="progress">
  <div class="progress-bar bg-danger" role="progressbar" style="width: 30%" aria-valuenow="30" aria-valuemin="0" aria-valuemax="100">30%</div>
</div>

  <!--Progress Bergaris & Animasi-->
  <div class="progress">
  <div class="progress-bar progress-bar-striped progress-bar-animated" 
       role="progressbar" 
       style="width: 70%" 
       aria-valuenow="70" 
       aria-valuemin="0" 
       aria-valuemax="100">
       Loading...
  </div>
</div>

<!--Progress Bertumpuk (Stacked)-->
<div class="progress">
  <div class="progress-bar bg-success" style="width: 40%">40%</div>
  <div class="progress-bar bg-warning" style="width: 30%">30%</div>
  <div class="progress-bar bg-danger" style="width: 20%">20%</div>
</div>

<!--Contoh Lengkap (Siap Dicoba)-->
<div class="container mt-4">
  <h1 class="display-4">
    Belajar Bootstrap <span class="badge bg-info">New</span>
  </h1>

  <p class="lead">Bootstrap memudahkan pembuatan website modern.</p>

  <h4>Status Belajar</h4>
  <div class="progress mb-3">
    <div class="progress-bar bg-success" style="width: 75%">75%</div>
  </div>

  <button class="btn btn-primary">
    Tugas <span class="badge bg-light text-dark">2</span>
  </button>
</div>

</body>
</html>
